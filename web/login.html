<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — LocalTTS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <div class="flex items-center gap-3 mb-6">
      <img src="/favicon.svg" class="w-10 h-10 rounded-xl shadow-md" alt="LocalTTS Logo" />
      <div>
        <h1 class="text-lg font-semibold leading-tight">LocalTTS</h1>
        <p class="text-xs text-slate-400">Sign in with .env credentials</p>
      </div>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
        <input id="username" type="text" required autocomplete="username"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          placeholder="admin" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          placeholder="••••••••" />
      </div>
      <div id="errBox" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800/60 rounded-lg px-3 py-2"></div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 transition text-white font-medium text-sm py-2.5 rounded-lg">
        Sign In
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errBox');
      errBox.classList.add('hidden');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || 'Login failed');
        }
        window.location.href = '/';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
