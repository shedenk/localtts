<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#glowGrad)"/>

  <!-- Left Sound Waves -->
  <path d="M 124 204 A 65 65 0 0 0 124 276" fill="none" stroke="#a5b4fc" stroke-width="22" stroke-linecap="round"/>
  <path d="M 84 176 A 110 110 0 0 0 84 304" fill="none" stroke="#818cf8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

  <!-- Right Sound Waves -->
  <path d="M 388 204 A 65 65 0 0 1 388 276" fill="none" stroke="#a5b4fc" stroke-width="22" stroke-linecap="round"/>
  <path d="M 428 176 A 110 110 0 0 1 428 304" fill="none" stroke="#818cf8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

  <!-- Microphone Capsule -->
  <rect x="216" y="128" width="80" height="144" rx="40" fill="url(#micGrad)"/>
  <!-- Microphone Grille Line Accent -->
  <line x1="232" y1="180" x2="280" y2="180" stroke="#c7d2fe" stroke-width="7" stroke-linecap="round"/>
  <line x1="236" y1="204" x2="276" y2="204" stroke="#c7d2fe" stroke-width="7" stroke-linecap="round"/>

  <!-- Microphone Stand U-Cup -->
  <path d="M 176 216 C 176 304 336 304 336 216" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

  <!-- Microphone Stem & Base -->
  <line x1="256" y1="296" x2="256" y2="364" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <line x1="196" y1="364" x2="316" y2="364" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
</svg>
