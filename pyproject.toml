[project]
name = "localtts"
version = "0.1.0"
description = "Self-hosted Local TTS & Whisper STT Hub (Kokoro, OmniVoice, Qwen3-TTS, Faster-Whisper) for macOS and Linux/Coolify"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "itsdangerous>=2.2.0",
    "psutil>=6.1.0",
    "numpy>=1.26.4,<2.3.0",
    "soundfile>=0.12.1",
    "httpx>=0.27.2",
    "kokoro-onnx>=0.4.0",
    "faster-whisper>=1.1.0",
    "edge-tts>=7.0.0",
]

[project.optional-dependencies]
omnivoice = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "omnivoice",
]
qwen3 = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "qwen-tts",
]

[tool.uv]
conflicts = [
    [
        { extra = "omnivoice" },
        { extra = "qwen3" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
